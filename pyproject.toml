[project]
name = "travsearch"
version = "2026.5.8.1"
description = "GUI to Search filenames or file content using fd and rg utilities."
readme = "README.md"
authors = [{name = "Travis L. Seymour, PhD", email = "nogard@ucsc.edu"}]
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "PySide6>=6.6",
    "jinja2>=3.1",
]

[project.urls]
"Bug Tracker" = "https://github.com/travisseymour/travsearch/issues"
"Documentation" = "https://github.com/travisseymour/travsearch#readme"

[project.scripts]
travsearch = "travsearch.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["travsearch"]

[tool.hatch.build.targets.wheel.force-include]
"travsearch/resources" = "travsearch/resources"

[dependency-groups]
dev = [
    "ruff>=0.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true